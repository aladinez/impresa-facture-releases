name: Approve production promotion
on:
  push:
    branches: [main]
    paths: [candidate.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-promotion
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.candidate.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Prepare the tested application revision for review
        id: candidate
        run: node prepare-candidate.mjs
  promote:
    name: Approve application ${{ needs.prepare.outputs.revision }}
    needs: prepare
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Recheck the staging revision after approval
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
        run: node railway-release.mjs verify staging "$RELEASE_SHA"
      - name: Rebuild the approved revision in production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
        run: node railway-release.mjs deploy production "$RELEASE_SHA"
      - name: Queue desktop update for the approved production commit
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
        run: |
          test -n "$GH_TOKEN" || { echo "Configure production secret DESKTOP_DISPATCH_TOKEN; see desktop release setup."; exit 1; }
          gh workflow run desktop.yml --repo aladinez/impresa-facture --ref "deploy/$RELEASE_SHA" -f channel=production -f revision="$RELEASE_SHA" -f publish=true -f promotion_run="$GITHUB_RUN_ID"
