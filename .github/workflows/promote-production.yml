name: Approve production promotion
on:
  push:
    branches: [main]
    paths: [candidate.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-promotion
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.candidate.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Prepare the tested application revision for review
        id: candidate
        run: node prepare-candidate.mjs
  promote:
    name: Approve application ${{ needs.prepare.outputs.revision }}
    needs: prepare
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Recheck the staging revision after approval
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
        run: node railway-release.mjs verify staging "$RELEASE_SHA"
      - name: Start desktop release before changing production web
        id: desktop
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
        run: |
          test -n "$GH_TOKEN" || { echo "Configure production Environment secret DESKTOP_DISPATCH_TOKEN with private repository Actions read/write."; exit 1; }
          node desktop-release.mjs start "$RELEASE_SHA" "$GITHUB_RUN_ID"
      - name: Rebuild the approved revision in production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
        run: node railway-release.mjs deploy production "$RELEASE_SHA"
      - name: Wait for production desktop and verify its signed update feed
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
          DESKTOP_RUN: ${{ steps.desktop.outputs.run }}
        run: node desktop-release.mjs wait "$RELEASE_SHA" "$DESKTOP_RUN"
